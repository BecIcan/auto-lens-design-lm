# Small, reproducible annular/HDOE design demo. Load after defaults.yml and
# designs/visible_f100_f2_m480_demo_start.yml.
model:
  lens_parameterization:
    init_args:
      freeze:
        s: [True, False]
        c: True
        g: True
        a: True
        d: True
        m: True
        # A2 is the only annular shape freedom in this small recovery demo.
        # dA1, dZ and all Rmax values remain exactly fixed.
        z:
          - - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
            - [True, False, True, True]
  ray_initialization:
    init_args:
      # This first demo deliberately freezes the hard problem to the design
      # wavelength and on-axis field. Broadband/order efficiency is a later gate.
      hfov: 0.
      n_fields: 1
      wavelengths: [550.]
      pupil_sampling_mode: skew_uniform
      pupil_sampling_kwargs:
        n_r: 64
        n_theta: 16
      ray_aiming_steps: 0
  optics_simulator:
    init_args:
      shape: [65, 65]
      shape_type: psf
      psf_abs_size: 0.04
      psf_grid_shape: [1, 1]
      diffraction_f_number:
      wavelengths: [550.]
      wavelength_weights:
        - [1.]
        - [1.]
        - [1.]
  residuals+:
    - class_path: eisoptx.optimization.residuals.HDOEPhaseResiduals
      init_args:
        weight: 1.e6
        diffraction_order: 480
        design_wavelength: 550.
        zonal_surface_index: 0
        field_indices: [0]
  lens_optimizer:
    class_path: eisoptx.optimization.optimizers.LMOptimizer
    init_args:
      lm_parameter: 1.
      damped_term_min: 1.e-6
      tolerance: 1.
      lam_increase_factor: 4.
      lam_decrease_factor: 2.
      lam_eps: 1.e-10
      beta: .95

data:
  init_args:
    n_samples: 15

trainer:
  max_steps: 15
  log_every_n_steps: 1
  val_check_interval: 5
  check_val_every_n_epoch:
  precision: 64
  logger:
    init_args:
      save_dir: logs/annular_demo_fit
  callbacks:
    - class_path: eisoptx.utils.callbacks.ConfigFileCallback
      init_args:
        every_n_steps: 5
    - eisoptx.main.CustomProgressBar
    - class_path: ModelCheckpoint
      init_args:
        every_n_train_steps: 5
        save_last: True
    - class_path: eisoptx.utils.visualization.VisualizationCallback
      init_args:
        every_n_steps: 5
        visualizations:
          - class_path: eisoptx.utils.visualization.LensLayout
            init_args:
              wavelengths: [550., 550., 550.]
              n_fields: 1
              n_rays: 5
          - class_path: eisoptx.utils.visualization.ZonalSurfaceProfile
            init_args:
              idx: 0
              sag_limits: [-0.22, 0.02]
              show_change: True
          - class_path: eisoptx.utils.visualization.SpotDiagrams
            init_args:
              field_indices: [0]
          - class_path: eisoptx.utils.visualization.PSFs
            init_args:
              wavelength_indices: [0]
              field_indices: [0]
              sqrt_scale: True
        save_formats: [png]
        rc_params:
          figure.figsize: '3.2, 2.1'
          figure.constrained_layout.use: 'True'
          figure.dpi: '160'
          font.size: '7'
