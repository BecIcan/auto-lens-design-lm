# Fit overlay for designs/visible_f100_f2_m480.yml. Load this file last:
# python -m eisoptx.main fit -c configs/raywave_zonal/defaults.yml -c configs/raywave_zonal/designs/visible_f100_f2_m480.yml -c configs/raywave_zonal/fit.yml
model:
  lens_parameterization:
    init_args:
      freeze:
        # Keep the generated element thickness fixed and optimize image focus only.
        s: [True, False]
        c: True
        g: True
        a: True
        d: True
        m: True
        # Per zone: [delta_A1, A2, delta_Z, Rmax]. Rmax is topology and
        # remains fixed; the first-zone delta_A1/delta_Z define the gauge.
        z:
          - - [True, False, True, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
            - [False, False, False, True]
  ray_initialization:
    init_args:
      # Stage 1 is the physically well-defined design wavelength. Broadband
      # HDOE acceptance is performed by coherent propagation, not three
      # independent geometric Snell branches.
      wavelengths: [550.]
      # Resolve every annulus with a deterministic, overdetermined LM system.
      pupil_sampling_kwargs:
        n_r: 64
        n_theta: 16
  optics_simulator:
    init_args:
      # LM is driven by geometric residuals. True coherent validation is the
      # separate wave.yml gate; do not label analytic Airy convolution as HDOE.
      diffraction_f_number:
      wavelengths: [550.]
      wavelength_weights:
        - [1.]
        - [1.]
        - [1.]
  residuals+:
    - class_path: eisoptx.optimization.residuals.HDOEPhaseResiduals
      init_args:
        # OPD is expressed in mm while transverse aberrations are image-plane
        # distances; this scale keeps the branch error below a small fraction
        # of one visible wavelength instead of letting spot merit dominate it.
        weight: 1.e6
        diffraction_order: 480
        design_wavelength: 550.
        zonal_surface_index: 0
        field_indices: [0]
  lens_optimizer:
    class_path: eisoptx.optimization.optimizers.LMOptimizer
    init_args:
      lm_parameter: 1e3
      damped_term_min: 1e-6
      tolerance: 1.
      lam_increase_factor: 4.
      lam_decrease_factor: 2.
      lam_eps: 1e-10
      beta: .95

data:
  init_args:
    n_samples: 200

trainer:
  max_steps: 200
  log_every_n_steps: 1
  val_check_interval: 25
  check_val_every_n_epoch:
  precision: 64
  callbacks:
    - class_path: eisoptx.utils.callbacks.ConfigFileCallback
      init_args:
        every_n_steps: 25
    - eisoptx.main.CustomProgressBar
    - class_path: ModelCheckpoint
      init_args:
        every_n_train_steps: 25
    - class_path: eisoptx.utils.visualization.VisualizationCallback
      init_args:
        every_n_steps: 25
        visualizations:
          - class_path: eisoptx.utils.visualization.LensLayout
            init_args:
              wavelengths: [486.1, 656.3, 550.]
              n_fields: 3
              n_rays: 3
          - class_path: eisoptx.utils.visualization.SpotDiagrams
            init_args:
              field_indices: [0, 1, 2]
          - class_path: eisoptx.utils.visualization.PSFs
            init_args:
              wavelength_indices: [0]
              field_indices: [0, 1, 2]
              sqrt_scale: True
        save_formats: [png]
        rc_params:
          figure.figsize: '3.2, 2.1'
          figure.constrained_layout.use: 'True'
          figure.dpi: '160'
          font.size: '7'
