# Control run: flat front frozen, back-surface curvature and asphere free.
model:
  ray_initialization:
    init_args:
      pupil_sampling_mode: skew_uniform
  lens_parameterization:
    init_args:
      freeze:
        s: True
        c: [True, False]
        g: True
        a: False
        m: True
        d: True
  residuals:
    - class_path: eisoptx.optimization.residuals.TransverseRayAberrationResiduals
      init_args:
        weight: 1.

trainer:
  callbacks:
    - class_path: eisoptx.utils.callbacks.ConfigFileCallback
      init_args:
        every_n_steps: 20
    - eisoptx.main.CustomProgressBar
    - class_path: eisoptx.utils.visualization.VisualizationCallback
      init_args:
        every_n_steps: 20
        visualizations:
          - class_path: eisoptx.utils.visualization.LensLayout
            init_args: {wavelengths: [486.1, 656.3, 550.], n_fields: 3, n_rays: 5}
          - class_path: eisoptx.utils.visualization.SpotDiagrams
            init_args: {field_indices: [0, 1, 2]}
        save_formats: [png]
        rc_params: {figure.figsize: '3.2, 2.1', figure.dpi: '160', font.size: '7'}
