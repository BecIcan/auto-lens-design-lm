limit_req_zone $binary_remote_addr zone=seed_api:10m rate=3r/m;

server {
    listen 443 ssl http2;
    server_name seed.example.com;

    ssl_certificate /etc/letsencrypt/live/seed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seed.example.com/privkey.pem;

    client_max_body_size 16k;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 190s;
    proxy_send_timeout 15s;

    location = /api/generate {
        limit_req zone=seed_api burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
