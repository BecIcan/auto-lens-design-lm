<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>EADLD Seed Lab</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">EADLD / SEED LAB</p>
          <h1>初始结构生成</h1>
        </div>
        <div class="runtime"><span></span>真实光线追迹</div>
      </header>

      <section class="workspace">
        <form id="seed-form" class="panel controls">
          <div class="section-head">
            <h2>设计指标</h2>
          </div>

          <div class="grid two">
            <label>焦距 / mm<input name="efl_mm" type="number" min="5" max="1000" step="0.1" value="74" required></label>
            <label>F/#<input name="f_number" type="number" min="1" max="32" step="0.1" value="2.8" required></label>
            <label>半视场 / °<input name="half_field_deg" type="number" min="0" max="59" step="0.01" value="6.17" required></label>
            <label>镜片数<select name="elements"><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option><option>9</option><option>10</option></select></label>
          </div>

          <label>波长 / nm<input name="wavelengths_nm" type="text" value="435, 545.5, 656" spellcheck="false" required></label>

          <details>
            <summary>结构约束</summary>
            <div class="grid two constraint-grid">
              <label>像面余量 / mm<input name="min_image_clearance_mm" type="number" min="0" max="200" step="0.1" value="6.3"></label>
              <label>系统总长 / mm<input name="max_package_length_mm" type="number" min="1" max="2000" step="0.1" value="55.5"></label>
              <label>最大畸变<input name="max_distortion_fraction" type="number" min="0" max="0.2" step="0.001" value="0.01"></label>
              <label>目标 CRA / °<input name="target_cra_deg" type="number" min="0" max="60" step="0.1" value="12"></label>
              <label>候选数<select name="candidate_count"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
            </div>
          </details>

          <button id="generate" type="submit"><span>生成初始结构</span><i></i></button>
          <button id="export-seq" class="secondary" type="button" disabled>导出 SEQ</button>
          <p id="quota" class="quota">正在读取今日额度…</p>
          <p class="contact">如需更多体验次数，联系 791395970@qq.com</p>
          <p id="message" class="message" aria-live="polite">输入指标后开始生成</p>
        </form>

        <section class="results">
          <div id="metrics" class="metrics" hidden>
            <div><span>镜片数</span><strong data-key="elements">—</strong><small>片</small></div>
            <div><span>EFL</span><strong data-key="efl_mm">—</strong><small>mm</small></div>
            <div><span>BFL</span><strong data-key="bfl_mm">—</strong><small>mm</small></div>
            <div><span>TTL</span><strong data-key="ttl_mm">—</strong><small>mm</small></div>
            <div><span>平均 RMS</span><strong data-key="mean_rms_um">—</strong><small>μm</small></div>
            <div><span>有效光线</span><strong data-key="valid_ray_percent">—</strong><small>%</small></div>
          </div>

          <div id="candidate-bar" class="candidate-bar" hidden>
            <span id="candidate-count"></span>
            <div id="candidate-buttons"></div>
          </div>

          <article class="panel figure wide">
            <div class="figure-head"><h2>光路图</h2><span>Layout</span></div>
            <div class="canvas"><p>等待生成</p><img id="layout" alt="生成结构的真实光线光路图" hidden></div>
          </article>

          <article class="panel figure">
            <div class="canvas spots"><p>等待追迹</p><img id="spots" alt="生成结构的真实光线点列图" hidden></div>
          </article>
        </section>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
